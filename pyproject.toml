[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mag-py"
version = "0.0.1"
description = "A from-scratch autograd engine targeting Apple Metal/MPS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
	"E",  # pycodestyle errors (including whitespace issues)
	"W",  # pycodestyle warnings (W291/W293 = trailing whitespaces)  
	"F",  # pyflakes (undefined names, unused imports)
	"I",  # isort (import ordering)
	"UP", # pyupgrade (modernize syntax)
]
